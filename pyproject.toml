[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "catalejo"
version = "0.1.0"
description = "Clean, structured access to Spanish securities regulator (CNMV) public data, as a Python library and MCP server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Pol Fañanás" }]
keywords = ["cnmv", "spain", "finance", "securities", "insider-trading", "mcp", "edgar"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "selectolax>=1.0",
    "tzdata; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/polfananas/catalejo"
Issues = "https://github.com/polfananas/catalejo/issues"
Changelog = "https://github.com/polfananas/catalejo/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "pypdf>=5"]
pdf = ["pypdf>=5"]
mcp = ["mcp>=1.20,<2"]

[project.scripts]
catalejo-mcp = "catalejo.mcp_server:main"

[tool.hatch.build.targets.sdist]
exclude = ["docs", ".github"]

[tool.hatch.build.targets.wheel]
packages = ["src/catalejo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true